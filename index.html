<style>
  :root{
    --ink:#2b2545; --ink-soft:#615a7d;
    --panel:#ffffff;
    /* 地の色は JPAO のデザインシステムに従う。tokens/colors.css は
       --white を「ベース背景」と定め、「アクセントは1〜2色、
       大きな塗りには使わない」と規定している。
       パステルの多方向ラジアルを重ねる candy 背景も、
       その代わりにクリーム色を敷くのも、どちらも既定色に逃げた形になる。
       彩度は50個のバブルが担うので、地は指定どおり白にする */
    --ground:#ffffff;
  }
  *{ box-sizing:border-box; }
  html{ height:100%; }
  body{
    margin:0; min-height:100%;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    color:var(--ink);
    background:var(--ground);
  }
  /* 粒子は地の上、コンテンツの下。文字の上には絶対に乗せない */
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    opacity:.5; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='160' height='160' filter='url(%23n)' opacity='0.055'/></svg>");
  }

  /* クラウド表示のときだけ画面を固定する。折り返し表示ではスクロールさせる */
  body.mode-cloud{ height:100%; overflow:hidden; }
  body.mode-flow{ overflow-y:auto; }

  /* ---- header ---- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:20;
    padding:18px 24px 12px;
    pointer-events:none;
  }
  /* 折り返し表示では固定をやめ、通常の流れに置く。
     これでバブルが見出しやリード文に重なる余地がなくなる */
  /* static では z-index が無効になり body::before の粒子に負けるので relative */
  body.mode-flow header{ position:relative; }
  h1{
    margin:0; font-size:clamp(20px,3.2vw,30px); font-weight:800; letter-spacing:.02em;
    display:flex; align-items:center; gap:.4em;
    word-break:keep-all; line-break:strict;
  }
  h1 .dot{
    width:.62em;height:.62em;border-radius:50%;
    background:conic-gradient(from 0deg,#ff8fab,#ffd166,#8ce0c8,#7db8ff,#c9a7ff,#ff8fab);
    /* 形をぼかして敷いた色付きの光をやめ、浅い一方向の影にする */
    box-shadow:0 1px 2px rgba(120,90,140,.35);
    animation:spin 8s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  header p{
    margin:6px 0 0; font-size:clamp(12.5px,1.6vw,14px); color:var(--ink-soft); font-weight:600;
    /* クラウド表示の文（32文字）が広い画面で1行に収まる幅。
       狭めすぎると desktop でも折れる */
    max-width:68ch;
    /* 折れる場合も、最後の1文字だけが次行に落ちるのを防ぐ */
    text-wrap:pretty;
    word-break:keep-all; line-break:strict;
  }

  header .invite{
    margin:5px 0 0; font-size:clamp(12px,1.5vw,13.5px); color:var(--ink-soft); font-weight:600;
    max-width:68ch; text-wrap:pretty; word-break:keep-all; line-break:strict;
  }
  /* header は pointer-events:none（下のバブルを押せるようにするため）。
     このままだとリンクに見えて押せないので、リンクだけ操作を受け付ける */
  header .invite a{ pointer-events:auto; }
  .form-link{
    color:#5330c4;                /* 白地で 8.12:1 */
    font-weight:800;
    text-decoration:underline; text-underline-offset:2px;
  }
  .form-link:hover{ color:#3f2496; }
  .form-link:focus-visible{ outline:3px solid #4a3f7a; outline-offset:2px; border-radius:3px; }

  @media (prefers-reduced-motion: reduce){
    h1 .dot{ animation:none; }
  }

  /* ---- floating field ---- */
  #field{ position:fixed; inset:0; z-index:10; }
  /* 折り返し表示: 重なりが原理的に起きないフロー配置にする */
  body.mode-flow #field{
    /* static だと z-index が効かず、body::before の粒子が
       コンテンツの上に乗ってしまう。粒子は必ず文字の下に置く */
    position:relative; inset:auto; z-index:1;
    display:flex; flex-wrap:wrap; align-content:flex-start;
    gap:10px; padding:14px 20px 48px;
  }

  .bubble{
    position:absolute; top:0; left:0;
    display:flex; align-items:center; justify-content:center;
    padding:.5em .95em; border-radius:999px;
    font-weight:800; color:#3a2f57; white-space:nowrap;
    cursor:pointer; user-select:none;
    border:2px solid rgba(255,255,255,.9);
    /* 全方位に広がるぼかしをやめ、浅い一方向の影 + 上端の内側ハイライト。
       光源が上にある面として見せる */
    box-shadow:0 2px 4px rgba(90,70,140,.20), inset 0 2px 3px rgba(255,255,255,.7);
    transition:box-shadow .18s ease, filter .18s ease, border-color .18s ease;
    will-change:transform;
  }
  body.mode-flow .bubble{ position:relative; top:auto; left:auto; transform:none !important; }

  /* 件数は共有人数そのもので、サイズ符号化の根拠になる情報。
     opacity:.6 では最悪 2.64:1 しか出ず読めなかったので不透明度をやめ、
     字の大きさと余白だけで主従をつける */
  .bubble small{ font-weight:700; margin-left:.45em; font-size:.68em; }

  .bubble:hover{
    /* ホバーで拡大させない。色調と縁だけ変える */
    filter:brightness(1.05);
    border-color:#fff;
    box-shadow:0 3px 6px rgba(90,70,140,.26), inset 0 2px 3px rgba(255,255,255,.8);
    /* 基準の z-index は共有人数（最大 10）なので、それより確実に上へ */
    z-index:50;
  }
  .bubble:focus-visible{
    outline:3px solid #4a3f7a;
    outline-offset:3px;
    z-index:60;
  }

  /* ---- detail panel ---- */
  #scrim{
    position:fixed; inset:0; z-index:30; background:rgba(43,37,69,.32);
    backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  #scrim.open{ opacity:1; pointer-events:auto; }
  #panel{
    position:fixed; z-index:40; top:0; right:0; height:100%;
    width:min(460px,92vw); background:var(--panel);
    box-shadow:-18px 0 50px rgba(60,40,110,.22);
    transform:translateX(102%); transition:transform .38s cubic-bezier(.22,1,.36,1);
    display:flex; flex-direction:column;
  }
  #panel.open{ transform:translateX(0); }
  .panel-head{
    padding:22px 56px 16px 24px;   /* 右は閉じるボタンの逃げ */
    position:relative;
    /* 桃と水色を混ぜた candy グラデーションをやめ、
       ブランドの soft tint（sky-soft）を1色だけ当てる */
    background:#eef2f8;
    border-bottom:1px solid rgba(43,37,69,.08);
  }
  .panel-head .kw{
    /* グラデーション文字をやめる。大きさと太さで十分に主役になる */
    font-size:22px; font-weight:900; color:var(--ink);
    word-break:keep-all; line-break:strict;
  }
  .panel-head .cnt{ display:block; margin-top:4px; font-size:13px; color:var(--ink-soft); font-weight:700; }
  #close{
    position:absolute; top:16px; right:16px; width:36px; height:36px; border-radius:50%;
    border:1px solid rgba(43,37,69,.10);
    background:#fff; color:#4a3f7a;      /* 4.15:1 → 9.20:1 */
    font-size:19px; cursor:pointer; font-weight:900;
    box-shadow:0 1px 2px rgba(90,70,140,.18);
    /* 記号を厳密に中央へ置く */
    display:flex; align-items:center; justify-content:center; line-height:1; padding:0;
  }
  #close:hover{ background:#4a3f7a; color:#fff; border-color:#4a3f7a; }
  #close:focus-visible{ outline:3px solid #4a3f7a; outline-offset:2px; }
  .panel-body{ padding:16px 20px 40px; overflow-y:auto; }

  .card{
    border:1px solid rgba(43,37,69,.09); border-radius:18px; padding:16px 16px 14px; margin-bottom:14px;
    background:#fff;
    box-shadow:0 1px 3px rgba(90,70,140,.07);
  }
  .card .name{ font-size:17px; font-weight:900; display:flex; align-items:baseline; gap:.5em; flex-wrap:wrap; }
  /* 鮮やかなピンクは 2.91:1 しか出ていなかった。深いローズに寄せて階調で見せる */
  .card .area{ font-size:12px; font-weight:700; color:#b02b52; }
  .row{ margin-top:10px; font-size:13.5px; line-height:1.7; }
  /* 項目名を淡い色のピルで包むのをやめる。書体の太さと色差だけで役割を示す */
  .row .lbl{
    font-size:11.5px; font-weight:800; color:#5a5375;   /* 4.00:1 → 7.17:1 */
    letter-spacing:.02em; margin-right:.6em;
  }
  .row .txt{ color:#3d3560; }
  .card a.link{ color:#5330c4; text-decoration:underline; text-underline-offset:2px; font-weight:700; }
  .card a.link:hover{ color:#3f2496; }
  .card a.link:focus-visible{ outline:3px solid #4a3f7a; outline-offset:2px; border-radius:3px; }

  /* こちらは実際に押せる操作子なので、チップの形のままで正しい */
  .chips{ margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-size:11.5px; font-weight:800; border-radius:999px; padding:4px 11px; cursor:pointer;
    border:1.5px solid transparent; color:#4a3f70; background:#f2eefb; transition:.15s;
  }
  .chip:hover{ background:#4a3f7a; color:#fff; }
  .chip:focus-visible{ outline:3px solid #4a3f7a; outline-offset:2px; }
  .chip.active{ background:#ffe1ec; color:#a32a4d; border-color:#d98aa7; }  /* 3.51:1 → 5.75:1 */

  /* ---- legend ---- */
  .legend{
    /* 見出しと同じ 24px の版面に揃える。角に放り出さない */
    position:fixed; left:24px; bottom:20px; z-index:15;
    font-size:12.5px; color:#57506f; font-weight:700;
    /* 背後がほぼ平坦な面なので、ぼかしても屈折するものがない。
       中途半端なガラスはやめて素直な不透明の面にする */
    background:#fdfbfa; border:1px solid rgba(43,37,69,.10);
    padding:9px 15px; border-radius:14px;
    box-shadow:0 1px 3px rgba(90,70,140,.14);
  }
  .legend b{ color:#a32a4d; }   /* 4.15:1 → 6.80:1 */
  .legend-note{ margin:0; }

  /* ── 漂う速さ ── */
  .speed{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  /* 折り返し表示には漂いが無いので、効かない操作子を出さない */
  body:not(.mode-cloud) .speed{ display:none; }
  .speed-label{ font-size:11.5px; font-weight:800; color:#5a5375; white-space:nowrap; }
  .speed-name{ font-size:11.5px; font-weight:800; color:#a32a4d; min-width:4.6em; text-align:right; }

  #speed{
    -webkit-appearance:none; appearance:none;
    width:112px; height:18px; margin:0; padding:0;
    background:transparent; cursor:pointer;
    --fill:50%;
  }
  /* トラック: 満たした側にブランドの6色を出す。
     上の層が --fill から先を静かな面で覆うので、値の分だけ色が現れる */
  #speed::-webkit-slider-runnable-track{
    height:5px; border-radius:99px;
    background-image:
      linear-gradient(90deg, transparent 0 var(--fill), #e4e0ec var(--fill) 100%),
      linear-gradient(90deg,#a89a00 0%,#8aa4ce 24%,#ca98ce 44%,#ca70ce 60%,#85c1ca 80%,#49819d 100%);
  }
  #speed::-moz-range-track{
    height:5px; border-radius:99px; border:none;
    background-image:
      linear-gradient(90deg, transparent 0 var(--fill), #e4e0ec var(--fill) 100%),
      linear-gradient(90deg,#a89a00 0%,#8aa4ce 24%,#ca98ce 44%,#ca70ce 60%,#85c1ca 80%,#49819d 100%);
  }
  /* つまみ: 既定の丸ではなく縦長のフェーダー型にする */
  #speed::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:10px; height:18px; border-radius:4px;
    background:#fff; border:1px solid rgba(43,37,69,.30);
    box-shadow:0 1px 2px rgba(90,70,140,.25);
    margin-top:-6.5px;            /* 5px のトラックの中心に合わせる (5-18)/2 */
  }
  #speed::-moz-range-thumb{
    width:10px; height:18px; border-radius:4px;
    background:#fff; border:1px solid rgba(43,37,69,.30);
    box-shadow:0 1px 2px rgba(90,70,140,.25);
  }
  #speed:focus-visible{ outline:none; }
  #speed:focus-visible::-webkit-slider-thumb{ outline:3px solid #4a3f7a; outline-offset:2px; }
  #speed:focus-visible::-moz-range-thumb{ outline:3px solid #4a3f7a; outline-offset:2px; }
  /* 折り返し表示では固定をやめる。押せるキーワードの上に居座らせない */
  body.mode-flow .legend{
    /* こちらも static にすると粒子の下に潜るので relative のまま上に置く */
    position:relative; left:auto; bottom:auto;
    margin:14px 20px 0; display:inline-block;
  }
</style>

let members = FALLBACK_MEMBERS;

/* ============ build keyword -> members index ============ */
/* シートを読み込んだあとに作り直すので関数にしておく */
let kwMap = new Map();
let keywords = [];

function buildIndex(){
  kwMap = new Map();
  members.forEach((m,i)=>{
    m.tags.forEach(t=>{
      if(!kwMap.has(t)) kwMap.set(t,[]);
      kwMap.get(t).push(i);
    });
  });
  keywords = [...kwMap.entries()]
    .map(([kw,ids])=>({kw,ids,count:ids.length}))
    .sort((a,b)=>b.count-a.count);
}
buildIndex();

/* candy palette */
const palettes = [
  ["#ffd6e7","#ff9ec4"],["#ffe6c7","#ffc178"],["#d8f5e6","#8fe0bd"],
  ["#d7ecff","#8fc4ff"],["#ecdcff","#c3a0ff"],["#fff2c2","#ffdd6b"],
  ["#ffdfd6","#ff9f8f"],["#d6f4ff","#7fdcf0"]
];

/* ============ keyword field ============ */
/*
  もとの実装は Math.random() だけで座標を決めており、衝突判定が一切なかった。
  そのため下になったキーワードは恒久的にクリックできず、そのメンバーは
  誰からも見つけられなかった。

  ただし「押し分ける」だけでは狭い画面は救えない。390px 幅で使える面積は
  約 273,000px^2、対して 50 個のバブルの合計面積は約 200,000px^2 あり、
  占有率が 70% を超える。どう並べても重なるので幾何学的に不可能。

  そこで2つの表示を持つ:
    cloud … 広い画面。漂わせたまま、毎フレーム重なりを解消する
    flow  … 狭い画面。漂うのをやめ、折り返して並べる（重なりが起きえない）
*/
const field = document.getElementById("field");
const hintEl = document.querySelector("header .hint");
const bubbles = [];
let W = 0, H = 0, topBound = 0, bottomBound = 0;
let mode = null;
let rafId = null;

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

function pickMode(){
  return (window.innerWidth >= 900 && window.innerHeight >= 560) ? "cloud" : "flow";
}

/* ヘッダーとレジェンドの実測値で上下の境界を決める。
   固定値 58 / 70 だったためリード文にバブルが重なっていた */
function measureBounds(){
  W = window.innerWidth;
  H = window.innerHeight;
  const header = document.querySelector("header");
  const legend = document.querySelector(".legend");
  topBound = (header ? header.getBoundingClientRect().height : 60) + 12;
  bottomBound = H - ((legend ? legend.getBoundingClientRect().height : 40) + 32);
  if (bottomBound - topBound < 120) bottomBound = topBound + 120;
}

/* 大きいものから順に、既に置いたものと重ならない場所を探す。
   完全に空いた場所が見つからない場合は重なり面積が最小の候補を採る */
function placeWithoutOverlap(){
  const PAD = 8;
  bubbles.forEach(b => { b.x = undefined; b.y = undefined; });
  bubbles.forEach(b => {
    const maxX = Math.max(W - b.w - GUTTER * 2, 1);
    const maxY = Math.max((bottomBound - b.h) - topBound, 1);
    let best = null, bestScore = Infinity;
    for (let attempt = 0; attempt < 240; attempt++){
      const x = GUTTER + Math.random() * maxX;
      const y = topBound + Math.random() * maxY;
      let score = 0;
      for (const o of bubbles){
        if (o === b || o.x === undefined) continue;
        const ox = Math.min(x + b.w, o.x + o.w) - Math.max(x, o.x) + PAD;
        const oy = Math.min(y + b.h, o.y + o.h) - Math.max(y, o.y) + PAD;
        if (ox > 0 && oy > 0) score += ox * oy;
      }
      if (score === 0){ best = { x, y }; break; }
      if (score < bestScore){ bestScore = score; best = { x, y }; }
    }
    b.x = best.x; b.y = best.y;
  });
}

/*
  重なっている対を、重なりが浅い軸に沿って押し分ける。
  つかんでいる（ホバー中の）バブルは動かさず、相手だけを動かす。

  重要: 位置を補正するだけでは速度が衝突前のまま相手を向き続けるので、
  次のフレームでまた押し戻され、位置補正が速度を打ち消し続ける。
  結果として接触したバブルはその場で失速し、接触の輪が広がるにつれ
  全体の運動エネルギーが目減りしていく。実質、反発係数0の接触だった。
  そこで位置の補正と一緒に、法線方向の速度も弾性衝突として交換する。
  質量は面積に比例させるので、大きいバブルはほとんど弾かれない。
*/
const RESTITUTION = 1;   // 反発係数。1 で法線方向の運動エネルギーを保存する

/* 漂う速さ。各バブルが持つ目標速度にこの倍率をかける。
   0 は「止める」。動きが苦手な人にとっての実用的な選択肢でもある */
const SPEED_STEPS = [
  { name: "止める",   scale: 0    },
  { name: "ゆっくり", scale: 0.6  },
  { name: "ふつう",   scale: 1    },
  { name: "いきいき", scale: 1.7  },
  { name: "にぎやか", scale: 2.6  }
];
const SPEED_DEFAULT = 2;
const SPEED_KEY = "jpao-cloud-speed";
let speedScale = SPEED_STEPS[SPEED_DEFAULT].scale;

function separate(){
  const PAD = 5;
  for (let i = 0; i < bubbles.length; i++){
    for (let j = i + 1; j < bubbles.length; j++){
      const a = bubbles[i], b = bubbles[j];
      const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) + PAD;
      const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y) + PAD;
      if (ox <= 0 || oy <= 0) continue;

      const aFixed = a.paused, bFixed = b.paused;
      if (aFixed && bFixed) continue;
      const share = (aFixed || bFixed) ? 1 : 0.5;
      const horizontal = ox < oy;

      /* ── 1. 位置の補正（重なりを解くだけ。力ではなく拘束） ── */
      if (horizontal){
        const push = ox * 0.5 * share;
        const dir = (a.x + a.w / 2) < (b.x + b.w / 2) ? -1 : 1;
        if (!aFixed) a.x += dir * push;
        if (!bFixed) b.x -= dir * push;
      } else {
        const push = oy * 0.5 * share;
        const dir = (a.y + a.h / 2) < (b.y + b.h / 2) ? -1 : 1;
        if (!aFixed) a.y += dir * push;
        if (!bFixed) b.y -= dir * push;
      }

      /* ── 2. 速度の応答（1次元の弾性衝突） ── */
      const key = horizontal ? "vx" : "vy";
      const ca = horizontal ? a.x + a.w / 2 : a.y + a.h / 2;
      const cb = horizontal ? b.x + b.w / 2 : b.y + b.h / 2;
      const n  = ca < cb ? 1 : -1;      // a から b へ向かう法線
      const ua = a[key] * n, ub = b[key] * n;
      if (ua - ub <= 0) continue;       // すでに離れつつあるなら触らない

      // 止めている側は無限質量として扱い、相手だけを弾き返す
      if (aFixed){ b[key] = (ua + RESTITUTION * (ua - ub)) * n; continue; }
      if (bFixed){ a[key] = (ub - RESTITUTION * (ua - ub)) * n; continue; }

      const ma = a.m, mb = b.m, sum = ma + mb;
      a[key] = ((ma * ua + mb * ub + mb * RESTITUTION * (ub - ua)) / sum) * n;
      b[key] = ((ma * ua + mb * ub + ma * RESTITUTION * (ua - ub)) / sum) * n;
    }
  }
}

/*
  弾性衝突にしても、位置補正の丸めや壁との同時接触で総エネルギーは
  わずかに目減りする。50個で長時間まわすと無視できないので、
  各バブルの速さを自分の目標値へごく弱く引き戻す。
  1フレームあたり2%だけなので動きとしては感じられないが、
  何分経っても漂いが止まらないし、暴走もしない。
*/
function thermostat(){
  bubbles.forEach(b => {
    if (b.paused) return;
    const target = b.target * speedScale;
    const s = Math.hypot(b.vx, b.vy);
    if (target === 0){               // 「止める」。急に固まらないよう滑らかに減速
      b.vx *= 0.94; b.vy *= 0.94;
      return;
    }
    if (s < 1e-4){                   // 完全に停止した場合は向きを与え直す
      const a = Math.random() * Math.PI * 2;
      b.vx = Math.cos(a) * target;
      b.vy = Math.sin(a) * target;
      return;
    }
    const k = 1 + (target / s - 1) * 0.02;
    b.vx *= k; b.vy *= k;
  });
}

/* 全部が止まりきったか。「止める」を選んだあと rAF を回し続けないための判定 */
function allSettled(){
  for (let i = 0; i < bubbles.length; i++){
    if (Math.hypot(bubbles[i].vx, bubbles[i].vy) > 0.004) return false;
  }
  return true;
}

/* 左右は 12px の余白を残す。2px だと文字が画面の縁に張り付いて見える */
const GUTTER = 12;

function clampAndPaint(bounce){
  bubbles.forEach(b => {
    if (b.x <= GUTTER){ b.x = GUTTER; if (bounce) b.vx = Math.abs(b.vx); }
    if (b.x >= W - b.w - GUTTER){ b.x = W - b.w - GUTTER; if (bounce) b.vx = -Math.abs(b.vx); }
    if (b.y <= topBound){ b.y = topBound; if (bounce) b.vy = Math.abs(b.vy); }
    if (b.y >= bottomBound - b.h){ b.y = bottomBound - b.h; if (bounce) b.vy = -Math.abs(b.vy); }
    b.el.style.transform = "translate(" + b.x + "px, " + b.y + "px)";
  });
}

function buildBubbles(){
  field.textContent = "";
  bubbles.length = 0;

  keywords.forEach((k, idx) => {
    const el = document.createElement("div");
    el.className = "bubble";
    const pal = palettes[idx % palettes.length];
    el.style.background = "linear-gradient(145deg, " + pal[0] + ", " + pal[1] + ")";
    el.style.fontSize = (15 + (k.count - 1) * 4) + "px";   // 共有人数で大きさを決める

    // innerHTML を使わず組み立てる
    el.appendChild(document.createTextNode(k.kw));
    if (k.count > 1){
      const s = document.createElement("small");
      s.textContent = k.count;
      el.appendChild(s);
    }

    // 共有人数が多いものを上の層に置く。万一重なっても主役が隠れない
    el.style.zIndex = String(1 + k.count);

    // マウス以外でも開けるようにする。もとは div のままでキーボードから
    // 1件も開けなかった
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "0");
    el.setAttribute("aria-label", k.kw + "（" + k.count + "名）");

    el.addEventListener("click", () => openPanel(k.kw));
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar"){
        e.preventDefault();
        openPanel(k.kw);
      }
    });

    field.appendChild(el);

    const b = {
      el, w: el.offsetWidth, h: el.offsetHeight,
      x: 0, y: 0,
      vx: (Math.random() * 2 - 1) * 0.35,
      vy: (Math.random() * 2 - 1) * 0.35,
      // 質量は面積に比例。大きいキーワードは小さいものに弾かれにくい
      m: el.offsetWidth * el.offsetHeight,
      /* 目標の速さ。全部同じだと機械的に見えるので1つずつ散らす。
         この幅だと実際の移動量が 0.26px/frame 前後で落ち着く。
         旧実装は開始直後が 0.22 で、10分後には 0.08 まで落ちていた */
      target: 0.17 + Math.random() * 0.14,
      paused: false, phase: Math.random() * Math.PI * 2
    };
    if (Math.abs(b.vx) < 0.12) b.vx = b.vx < 0 ? -0.18 : 0.18;
    if (Math.abs(b.vy) < 0.12) b.vy = b.vy < 0 ? -0.18 : 0.18;

    // 拡大させない。読もうとしたキーワードが動くのは邪魔になる
    const hold = () => { b.paused = true; };
    const release = () => { b.paused = false; };
    el.addEventListener("mouseenter", hold);
    el.addEventListener("mouseleave", release);
    el.addEventListener("focus", hold);
    el.addEventListener("blur", release);

    bubbles.push(b);
  });
}

function tick(t){
  if (mode !== "cloud"){ rafId = null; return; }
  // 「止める」で完全に静止したらループ自体を降りる。上げ直したら applySpeed が再開する
  if (speedScale === 0 && allSettled()){ rafId = null; return; }
  bubbles.forEach(b => {
    if (b.paused) return;
    b.x += b.vx;
    // ゆるやかな上下。速度とは独立に位置へ足すので、倍率をかけないと
    // 「止める」でも揺れ続けてしまう
    b.y += b.vy + Math.sin(t / 1400 + b.phase) * 0.12 * speedScale;
  });
  separate();
  clampAndPaint(true);
  thermostat();
  rafId = requestAnimationFrame(tick);
}

function layout(){
  const next = pickMode();
  const changed = next !== mode;
  mode = next;
  document.body.classList.toggle("mode-cloud", mode === "cloud");
  document.body.classList.toggle("mode-flow",  mode === "flow");

  if (hintEl){
    hintEl.textContent = (mode === "cloud" && speedScale > 0)
      ? "ふわふわ漂うキーワードを選ぶと、そのメンバーの自己紹介が開きます"
      : "キーワードを選ぶと、そのメンバーの自己紹介が開きます";
  }

  if (changed || bubbles.length === 0) buildBubbles();
  // 表示切替でパディングが変わるので、寸法は必ず組み立て後に測る
  bubbles.forEach(b => {
    b.w = b.el.offsetWidth; b.h = b.el.offsetHeight;
    b.m = b.w * b.h;   // 寸法が変われば質量も更新する
  });

  if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }

  if (mode === "flow"){
    // 折り返し配置は CSS が並べる。transform は使わない
    return;
  }

  measureBounds();
  placeWithoutOverlap();
  for (let i = 0; i < 60; i++) separate();   // 置いた直後に一度ほどく
  clampAndPaint(false);

  // 倍率とトラックの塗りを同期し、必要ならループを再開する
  applySpeed(speedIndex, false);
}

/* ============ 漂う速さ ============ */
const speedInput = document.getElementById("speed");
const speedName  = document.getElementById("speed-name");
let speedIndex = SPEED_DEFAULT;

function applySpeed(i, save){
  speedIndex = Math.min(Math.max(i | 0, 0), SPEED_STEPS.length - 1);
  const step = SPEED_STEPS[speedIndex];
  speedScale = step.scale;

  if (speedInput){
    speedInput.value = String(speedIndex);
    // 満たした割合。トラックのブランド色がここまで現れる
    speedInput.style.setProperty("--fill",
      (speedIndex / (SPEED_STEPS.length - 1)) * 100 + "%");
    // 読み上げに「2」ではなく「ふつう」と伝える
    speedInput.setAttribute("aria-valuetext", step.name);
  }
  if (speedName) speedName.textContent = step.name;

  if (hintEl){
    hintEl.textContent = (mode === "cloud" && speedScale > 0)
      ? "ふわふわ漂うキーワードを選ぶと、そのメンバーの自己紹介が開きます"
      : "キーワードを選ぶと、そのメンバーの自己紹介が開きます";
  }

  if (save){
    try { localStorage.setItem(SPEED_KEY, String(speedIndex)); } catch (e) {}
  }
  // 止めていたループを起こす
  if (mode === "cloud" && rafId === null) rafId = requestAnimationFrame(tick);
}

if (speedInput){
  speedInput.addEventListener("input", () => applySpeed(+speedInput.value, true));
}

/* 前回の選択を復元。無ければ、動きを控える設定の人は「止める」から始める */
(function initSpeed(){
  let saved = null;
  try { saved = localStorage.getItem(SPEED_KEY); } catch (e) {}
  if (saved !== null && saved !== "" && !isNaN(+saved)) speedIndex = +saved;
  else speedIndex = reduceMotion.matches ? 0 : SPEED_DEFAULT;
  speedScale = SPEED_STEPS[Math.min(Math.max(speedIndex,0),SPEED_STEPS.length-1)].scale;
})();

/* ============ detail panel ============ */
const scrim=document.getElementById("scrim");
const panel=document.getElementById("panel");
const panelKw=document.getElementById("panelKw");
const panelCnt=document.getElementById("panelCnt");
const panelBody=document.getElementById("panelBody");
const closeBtn=document.getElementById("close");
let activeKw=null;
let lastFocus=null;

// 初期状態は閉じている。Tab で画面外のパネルに入れないようにしておく
panel.setAttribute("inert","");

/* 引用符も落とす。data-kw="..." や href="..." に値を差し込むので、
   " が素通りすると属性が壊れる */
function esc(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* 生のURLをそのまま並べると読みにくい。ホスト名だけ見せる */
function urlLabel(u){
  try { return new URL(u).hostname.replace(/^www\./,""); }
  catch (e) { return u; }
}

function openPanel(kw){
  activeKw=kw;
  const ids = kwMap.get(kw) || [];
  panelKw.textContent = "「"+kw+"」";
  panelCnt.textContent = ids.length + "名のメンバーが当てはまります";
  panelBody.innerHTML = ids.map(i=>{
    const m=members[i];
    const chips = m.tags.map(t=>`<span class="chip${t===kw?' active':''}" role="button" tabindex="0"`
      + ` aria-label="${esc(t)}のメンバーを見る" data-kw="${esc(t)}">${esc(t)}</span>`).join("");
    const urlRow = m.url ? `<div class="row"><span class="lbl">リンク</span><a class="link" href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">${esc(urlLabel(m.url))}</a></div>` : "";
    const hitokoto = m.hitokoto ? `<div class="row"><span class="lbl">ひとこと</span><span class="txt">${esc(m.hitokoto)}</span></div>` : "";
    return `<div class="card">
      <div class="name">${esc(m.name)} <span class="area">${esc(m.area)}</span></div>
      <div class="row"><span class="lbl">仕事・活動</span><span class="txt">${esc(m.work)}</span></div>
      <div class="row"><span class="lbl">趣味・関心</span><span class="txt">${esc(m.hobby)}</span></div>
      <div class="row"><span class="lbl">有償で</span><span class="txt">${esc(m.paid)}</span></div>
      <div class="row"><span class="lbl">無償でも</span><span class="txt">${esc(m.free)}</span></div>
      <div class="row"><span class="lbl">期待</span><span class="txt">${esc(m.expect)}</span></div>
      ${hitokoto}
      ${urlRow}
      <div class="chips">${chips}</div>
    </div>`;
  }).join("");
  // chip -> 別のキーワードへ。マウスとキーボードの両方で動かす
  panelBody.querySelectorAll(".chip").forEach(c=>{
    const jump = ()=>openPanel(c.dataset.kw);
    c.addEventListener("click", jump);
    c.addEventListener("keydown", e=>{
      if(e.key==="Enter"||e.key===" "||e.key==="Spacebar"){ e.preventDefault(); jump(); }
    });
  });
  panelBody.scrollTop=0;

  const firstOpen = !panel.classList.contains("open");
  scrim.classList.add("open");
  panel.classList.add("open");
  panel.setAttribute("aria-hidden","false");
  panel.removeAttribute("inert");

  // 開いた元の場所を覚えておき、閉じたら必ずそこへ戻す
  if(firstOpen){
    lastFocus = document.activeElement;
    closeBtn.focus();
  }
}
function closePanel(){
  if(!panel.classList.contains("open")) return;
  scrim.classList.remove("open");
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden","true");
  // 画面外にあるだけでは Tab で入れてしまうので、フォーカスごと閉じる
  panel.setAttribute("inert","");
  activeKw=null;
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus=null;
}
closeBtn.addEventListener("click",closePanel);
scrim.addEventListener("click",closePanel);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closePanel(); });

/* ============ resize + init ============ */
/*
  もとの onResize は座標を新しい枠に押し込めるだけで、並べ直しをしなかった。
  そのため 390px で開いてから広げても、クラウドは狭いまま左に固まっていた。
  ここでは表示の切替も含めて丸ごと組み直す。
*/
let resizeTimer = null;
function onResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(layout, 160);
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", onResize);

// 動きを控える設定に切り替えられたら、その場で従う
if (reduceMotion.addEventListener) reduceMotion.addEventListener("change", layout);

/* 書体の読み込みで幅が変わるとバブルの寸法がずれるので、確定後に測り直す */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

layout();

/* ============ スプレッドシートから読み込む ============ */
/*
  正は「JPAOメンバー自己紹介一覧」タブ（gid=0）。
  Google の gviz エンドポイントは要求元オリジンに対して
  access-control-allow-origin を返すので、Apps Script を挟まずに
  ページから直接読める。cache-control も no-store なので常に最新。

  シートに人を追加したら、このページは次に開かれた時点で反映される。
  デプロイ作業は要らない。

  【前提】シートに「キーワード」列が必要。
  クラウドの大小は同じキーワードが何人に付いているかで決まるので、
  表記が揺れると「音楽」と「音楽鑑賞」が別物になって階層が壊れる。
  だから散文から自動抽出はしない。列が空の人は雲に出さず、
  コンソールに名前を出して知らせる。
*/
const SHEET_ID = "1dPR-8eSQmRAnFvSJ9siNmEUs9ZmVz_e6VpqktmCxDA8";
/* シートはこの1枚だけ。ここにキーワード列があり、
   新しい回答は自動で行が増えるので転記待ちが発生しない。
   （以前あった「JPAOメンバー自己紹介一覧」タブは削除されている） */
const GID_MAIN = "571669687";
const sheetUrl = gid => "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
                        "/gviz/tq?tqx=out:json&headers=0&gid=" + gid;

/*
  見出しの文字列 → メンバーのキー。

  完全一致で照合していたら、見出しが
  「キーワード」→「キーワード（近いキーワードがあれば寄せるようにする）」
  に変わっただけで列を見失い、全員がキーワードなし扱いになった。
  見出しに補足を書き足すのは自然な運用なので、そこで壊れる作りが間違い。
  いまは「その語を含むか」で照合する。2タブの書き方の違い
  （「お名前を教えてください」／「お名前」）も同時に吸収できる。

  【重要】ここに挙げた語を含む見出しだけを取り込む。
  回答タブの「メールアドレス」はどの語にも当たらないので読み捨てられ、
  画面には一切出ない。公開ページなので、この列を拾う語を足さないこと。
  念のため NEVER_MAP で二重に弾いている。
*/
const FIELD_MAP = [
  ["お名前",           "name"],
  ["お住まいの地域",     "area"],
  ["お仕事",           "work"],
  ["趣味",             "hobby"],
  ["URL",              "url"],
  ["有償",             "paid"],
  ["無償",             "free"],
  ["期待",             "expect"],
  ["ひとこと",          "hitokoto"],
  ["キーワード",        "tagsRaw"]
];

/* 個人情報の列は、たとえ上の語を含んでいても絶対に対応付けない */
const NEVER_MAP = /メール|mail|電話|tel|住所|生年|氏名カナ/i;

function tidy(s){
  if (typeof s !== "string") return "";
  // 改行を消した名残の行頭「・」だけ落とす。
  // 語中の「・」は「執筆・出版」のような複合語なので触らない
  return s.replace(/\s+/g, " ").replace(/^[・･]\s*/, "").trim();
}

function normalizeUrl(u){
  const s = tidy(u);
  if (!s || /^(なし|無し|特になし|ー|-|—)$/.test(s)) return "";
  const m = s.match(/https?:\/\/[^\s]+/);   // 複数書かれていたら先頭だけ使う
  return m ? m[0] : "";
}

function parseSheet(text, requireTags){
  const m = text.match(/setResponse\(([\s\S]*)\)/);
  if (!m) throw new Error("応答の形が想定と違う");
  const rows = JSON.parse(m[1]).table.rows
    .map(r => (r.c || []).map(c => (c && c.v != null) ? c.v : ""));

  // 見出しは1行目とは限らない（一覧タブは上にタイトル行がある）。
  // 見出しの書き方も2種類あるので前方一致で探す
  const hi = rows.findIndex(r => r.some(v => tidy(v).indexOf("お名前") === 0));
  if (hi < 0) throw new Error("見出し行が見つからない");
  const header = rows[hi].map(tidy);

  const col = {};
  const upper = header.map(h => (h || "").toUpperCase());
  FIELD_MAP.forEach(pair => {
    const needle = pair[0].toUpperCase(), key = pair[1];
    for (let i = 0; i < header.length; i++){
      if (!header[i]) continue;
      if (NEVER_MAP.test(header[i])) continue;      // 個人情報の列は拾わない
      if (upper[i].indexOf(needle) >= 0){ col[key] = i; break; }
    }
  });
  if (col.name == null) throw new Error("「お名前」列が無い");

  const list = [], noTags = [];
  rows.slice(hi + 1).forEach(r => {
    const get = k => (col[k] == null) ? "" : tidy(r[col[k]]);
    const name = get("name");
    if (!name) return;
    if (/test\s*data|テストデータ/i.test(name)) return;   // テスト行は載せない

    // 空白では割らない。「AI SaaS」のような語が壊れる
    const tags = get("tagsRaw").split(/[、，,／\/]+/).map(s => s.trim()).filter(Boolean);
    if (requireTags && !tags.length){ noTags.push(name); return; }

    list.push({
      name: name,          area:  get("area"),
      work: get("work"),   hobby: get("hobby"),
      paid: get("paid"),   free:  get("free"),
      expect: get("expect"), hitokoto: get("hitokoto"),
      url: normalizeUrl(get("url")),
      tags: tags
    });
  });

  // 同じ名前が複数行あれば後の行を採用して1人にまとめる
  const byName = new Map();
  list.forEach(p => byName.set(p.name, p));
  return { members: [...byName.values()], noTags: noTags };
}

function applyMembers(fresh){
  const openKw = activeKw;
  members = fresh;
  buildIndex();
  bubbles.length = 0;        // 作り直させる
  layout();
  // 開いていたパネルは、そのキーワードが残っていれば開き直す
  if (openKw){
    if (kwMap.has(openKw)) openPanel(openKw); else closePanel();
  }
}

/* 埋め込みデータが持っている「ひとこと」を名前で引き継ぐ。
   シートは1枚に統合され「ひとこと」列が無くなったので、
   すでに公開されている文を落とさないための繋ぎ。
   シート側に「ひとこと」列を作ればそちらが優先される（FIELD_MAP に残してある） */
const FALLBACK_NOTES = new Map(
  FALLBACK_MEMBERS.filter(m => m.hitokoto).map(m => [m.name, m.hitokoto])
);

function loadFromSheet(){
  fetch(sheetUrl(GID_MAIN), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(text => {
      const res = parseSheet(text, true);

      res.members.forEach(p => {
        if (!p.hitokoto && FALLBACK_NOTES.has(p.name)) p.hitokoto = FALLBACK_NOTES.get(p.name);
      });

      if (res.noTags.length){
        console.warn("[JPAO] キーワード列が空のため雲に出していません: "
          + res.noTags.join("、"));
      }
      if (!res.members.length){
        console.warn("[JPAO] シートから取り込める行が0件でした。"
          + "「キーワード」列が未設定の可能性があります。埋め込みの"
          + FALLBACK_MEMBERS.length + "名で表示しています。");
        return;
      }
      applyMembers(res.members);
      console.info("[JPAO] シートから " + res.members.length + "名を読み込みました。");
    })
    .catch(e => {
      // 読めなくても埋め込み分で動き続ける。ここで画面を壊さない
      console.warn("[JPAO] シートを読めなかったので埋め込みデータで表示します: " + e.message);
    });
}

loadFromSheet();
</script>
