/* ============ build keyword -> members index ============ */
const kwMap = new Map();
members.forEach((m,i)=>{
  m.tags.forEach(t=>{
    if(!kwMap.has(t)) kwMap.set(t,[]);
    kwMap.get(t).push(i);
  });
});
const keywords = [...kwMap.entries()]
  .map(([kw,ids])=>({kw,ids,count:ids.length}))
  .sort((a,b)=>b.count-a.count);

/* candy palette */
const palettes = [
  ["#ffd6e7","#ff9ec4"],["#ffe6c7","#ffc178"],["#d8f5e6","#8fe0bd"],
  ["#d7ecff","#8fc4ff"],["#ecdcff","#c3a0ff"],["#fff2c2","#ffdd6b"],
  ["#ffdfd6","#ff9f8f"],["#d6f4ff","#7fdcf0"]
];

/* ============ floating field ============ */
const field = document.getElementById("field");
let W = field.clientWidth, H = field.clientHeight;
const bubbles = [];

function makeBubbles(){
  field.innerHTML="";
  bubbles.length=0;
  keywords.forEach((k,idx)=>{
    const el = document.createElement("div");
    el.className="bubble pop";
    const pal = palettes[idx % palettes.length];
    el.style.background = `linear-gradient(145deg, ${pal[0]}, ${pal[1]})`;
    const fs = 15 + (k.count-1)*4;                 // size by shared count
    el.style.fontSize = fs + "px";
    el.innerHTML = k.kw + (k.count>1 ? `<small>${k.count}</small>` : "");
    el.addEventListener("click", ()=>openPanel(k.kw));
    field.appendChild(el);

    const w = el.offsetWidth, h = el.offsetHeight;
    const b = {
      el, w, h,
      x: Math.random()*(Math.max(W-w,10)),
      y: 70 + Math.random()*(Math.max(H-h-140,10)),
      vx:(Math.random()*2-1)*0.35,
      vy:(Math.random()*2-1)*0.35,
      paused:false, phase:Math.random()*Math.PI*2
    };
    if(Math.abs(b.vx)<0.12) b.vx = b.vx<0?-0.18:0.18;
    if(Math.abs(b.vy)<0.12) b.vy = b.vy<0?-0.18:0.18;
    el.addEventListener("mouseenter",()=>{ b.paused=true; el.style.transform+=" scale(1.14)"; });
    el.addEventListener("mouseleave",()=>{ b.paused=false; });
    bubbles.push(b);
  });
  setTimeout(()=>bubbles.forEach(b=>b.el.classList.remove("pop")),450);
}

function tick(t){
  bubbles.forEach(b=>{
    if(!b.paused){
      b.x += b.vx;
      b.y += b.vy + Math.sin(t/1400 + b.phase)*0.12; // gentle bob
      if(b.x<=0){ b.x=0; b.vx=Math.abs(b.vx); }
      if(b.x>=W-b.w){ b.x=W-b.w; b.vx=-Math.abs(b.vx); }
      if(b.y<=58){ b.y=58; b.vy=Math.abs(b.vy); }
      if(b.y>=H-b.h-70){ b.y=H-b.h-70; b.vy=-Math.abs(b.vy); }
      b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
    }
  });
  requestAnimationFrame(tick);
}

    const chips = m.tags.map(t=>`<span class="chip${t===kw?' active':''}" data-kw="${esc(t)}">${esc(t)}</span>`).join("");
    const urlRow = m.url ? `<div class="row"><span class="lbl">URL</span><a class="link" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url)}</a></div>` : "";
    const hitokoto = m.hitokoto ? `<div class="row"><span class="lbl">ひとこと</span><span class="txt">${esc(m.hitokoto)}</span></div>` : "";
    return `<div class="card">
      <div class="name">${esc(m.name)} <span class="area">${esc(m.area)}</span></div>
      <div class="row"><span class="lbl">仕事・活動</span><span class="txt">${esc(m.work)}</span></div>
      <div class="row"><span class="lbl">趣味・関心</span><span class="txt">${esc(m.hobby)}</span></div>
      <div class="row"><span class="lbl">有償で</span><span class="txt">${esc(m.paid)}</span></div>
      <div class="row"><span class="lbl">無償でも</span><span class="txt">${esc(m.free)}</span></div>
      <div class="row"><span class="lbl">期待</span><span class="txt">${esc(m.expect)}</span></div>
      ${hitokoto}
      ${urlRow}
      <div class="chips">${chips}</div>
    </div>`;
  }).join("");
  // chip -> jump to another keyword
  panelBody.querySelectorAll(".chip").forEach(c=>{
    c.addEventListener("click",()=>openPanel(c.dataset.kw));
  });
  panelBody.scrollTop=0;
  scrim.classList.add("open");
  panel.classList.add("open");
  panel.setAttribute("aria-hidden","false");
}
function closePanel(){
  scrim.classList.remove("open");
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden","true");
  activeKw=null;
}
document.getElementById("close").addEventListener("click",closePanel);
scrim.addEventListener("click",closePanel);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closePanel(); });

/* ============ resize + init ============ */
function onResize(){
  W=field.clientWidth; H=field.clientHeight;
  bubbles.forEach(b=>{
    b.x=Math.min(b.x, Math.max(W-b.w,0));
    b.y=Math.min(b.y, Math.max(H-b.h-70,58));
  });
}
window.addEventListener("resize",onResize);

makeBubbles();
requestAnimationFrame(tick);
</script>
</body>
